site_name: Carpintero
site_description: A PARSE-class grammar dialect for Arturo — rules that compose, nest, recurse, and match blocks as well as strings.
site_url: https://lulzx.com/carpintero/
repo_url: https://github.com/Lulzx/carpintero
repo_name: Lulzx/carpintero
copyright: Carpintero — a grammar dialect for Arturo

# docs/ is staged from the markdown at the repository root, so those files
# stay the single source of truth and GitHub renders them as it always did.
# Run scripts/stage-docs.sh before mkdocs serve.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

nav:
  - Overview: index.md
  - Tutorial: TUTORIAL.md
  - Manual: MANUAL.md
  - Examples: examples/README.md
  - Proposal: proposal.md
  - Interpreter bugs: bugs/README.md

# The markdown lives at the repository root and is staged into docs/, so a
# cross-document link has to work in two renderers at once. Ask mkdocs to
# check them, and check the #anchors too — with --strict in CI a broken
# cross-reference fails the build instead of shipping.
#
# Links into source files (carpintero.art, demo.art, the .art examples)
# have no page in the site and are left at info: they resolve on GitHub,
# which is where a reader following them wants to end up anyway.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: info
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Lulzx/carpintero
      name: Carpintero on GitHub
