name: docs

on:
  push:
    branches: [main]
    # docs/ is generated by scripts/stage-docs.sh and not in git, so the site
    # only changes when one of its sources does. Anything else — the dialect,
    # the tests, the examples — leaves the built pages byte-identical.
    paths:
      - README.md
      - TUTORIAL.md
      - MANUAL.md
      - proposal.md
      - bugs/README.md
      - examples/README.md
      - mkdocs.yml
      - requirements-docs.txt
      - scripts/stage-docs.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, and let a running one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: ./scripts/stage-docs.sh
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
